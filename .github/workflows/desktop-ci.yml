name: Desktop App CI

on:
  push:
    branches:
      - main
    paths:
      - "notable-finance-app/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "notable-finance-app/**"
      - ".github/workflows/desktop-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: notable-finance-app
        run: pnpm run typecheck

      - name: Lint
        working-directory: notable-finance-app
        run: pnpm run lint

      - name: Test
        working-directory: notable-finance-app
        run: pnpm run test
